[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "critique"
version = "0.1.0"
description = "A local side-by-side git diff viewer."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Critique contributors" }
]
dependencies = []

[project.scripts]
cr = "critique.app:main"

[tool.setuptools]
packages = ["critique"]

[tool.setuptools.package-data]
critique = ["*.css", "*.html", "*.js", "*.png"]
